  - id: descend-through-the-library
    name: Descend Through the Library
    description: 'The party enters the city''s library in protective suits. The locals
      believe poisonous gas kills anyone who enters, but shadow creatures inhabit
      the building and feed on intruders.

      '
    description_content: null
    events_content: null
    triggers_content: null
    possible_approaches_content: null
    status: planned
    act: null
    order: 8
    triggers:
    - The party accepts the resistance's plan to reach the golem power source.
    events: 'The party must move through multiple floors toward the sewers. Wraiths
      hide in dark areas, possess damaged suits, and return shortly after being defeated.
      Fire and intense light can drive them back.

      '
    secrets:
    - The suits prevent exposure to the supposed poison, but they do not prevent the
      wraiths from possessing a wearer after the suit is breached.
    - Orik can light the darkened room long enough for the party to escape, but the
      source draft has him sacrifice himself to buy that time.
    possible_approaches:
    - Use intense light or fire to keep the wraiths away.
    - Protect the suits and retreat when one is breached.
    - Continue down toward the sewers and the hidden route to the power source.
    - Choose whether to stay and help Orik or use his sacrifice to escape.
