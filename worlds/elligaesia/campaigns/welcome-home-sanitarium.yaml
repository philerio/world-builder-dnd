  - id: meet-wicket-warrick
    name: Meet Wicket Warrick
    description: 'Two explorers wait at the docks in Minrath for Wicket Warrick, a
      mysterious contact who promises to take them somewhere extraordinary.

      '
    description_content: null
    events_content: null
    triggers_content: null
    possible_approaches_content: null
    status: completed
    act: null
    order: 1
    triggers:
    - The explorers meet Wicket at the agreed dock and time.
    events: 'Wicket arrives aboard The Hive with his orc bodyguards, Glog and Gloc.
      A dispute with the port master over docking fees is defused with a bag of payment.
      Wicket offers the explorers a share of whatever they find.

      '
    secrets:
    - Wicket is deliberately vague about the destination because he enjoys keeping
      people curious and does not want listeners to learn his plans.
    - Wicket believes the destination is a wealthy city in the sky and expects its
      treasure and technology to make the expedition worthwhile.
    possible_approaches:
    - Negotiate Wicket's promised share before accepting.
    - Ask the port master about The Hive or its unusual crew.
    - Inspect the ship and its octagonal doors and windows.
