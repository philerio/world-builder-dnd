  - id: cross-the-shifting-sands
    name: Cross the Shifting Sands
    description: 'The Hive approaches a massive storm over the Shifting Sands. Wicket
      plans to ride the wind around the tornado, climb above its eye, and descend
      through the center.

      '
    description_content: null
    events_content: null
    triggers_content: null
    possible_approaches_content: null
    status: planned
    act: null
    order: 5
    triggers:
    - The ship reaches the storm above the Shifting Sands.
    events: 'The party and crew work the ship''s wings under Chirpa''s directions.
      Strength checks become harder as the ship circles the storm, while lightning
      strikes can damage the ship. A severe failure may send it spinning into the
      storm and toward a crash.

      '
    secrets: []
    possible_approaches:
    - Help operate one of the ship's wings.
    - Protect the crew and ship when lightning strikes.
    - Find another way to stabilize the ship if Wicket's plan fails.
