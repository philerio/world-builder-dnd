  - id: solve-the-ancient-rooms
    name: Solve the Ancient Rooms
    description: 'A sequence of puzzle rooms guards the route to the golem power source.
      The rooms test observation, cooperation, memory, and willingness to endure apparent
      failure.

      '
    description_content: null
    events_content: null
    triggers_content: null
    possible_approaches_content: null
    status: planned
    act: null
    order: 10
    triggers:
    - The party opens the route beyond the abandoned chamber.
    events: 'Prepared room ideas include a button that resets descending ceiling spikes;
      a spider encounter that can be approached stealthily or fought; four riddles
      with two failures allowed; a hidden floor path where levitation is suppressed;
      a water-measuring puzzle above rising lava; a mirror that reveals a key and
      an invisible guardian tracked by sand; a maze creature that is forgotten whenever
      the party looks away; and guards where one always lies and one always tells
      the truth.

      '
    secrets: []
    possible_approaches:
    - Test what the button changes before deciding whether it is a trap.
    - Use stealth to pass the spider or risk a fight.
    - Solve the riddles before the two permitted failures are used.
    - Look for environmental clues to the hidden floor path.
    - Measure water between the two containers to match the required amount.
    - Use the mirror and disturbed sand to locate the guardian and key.
    - Record actions and injuries in the memory-loss maze so the party can compare
      notes.
    - Determine which guard lies before choosing a door.
    leads_to:
