  - id: aerith-held-in-stratos
    name: Aerith Held in the City
    description: Aerith wakes in a stone cell high on a mountainside, guarded by silent
      golems. After several days, Dorith arrives and claims to recognize her as the
      lost princess.
    description_content: null
    events_content: null
    triggers_content: null
    possible_approaches_content: null
    status: completed
    act: null
    order: 2
    triggers:
    - Aerith has been held in the cell for several days.
    events: Dorith releases Aerith, offers food and clean clothes, and returns some
      of her belongings. He keeps their conversation private and limits what he tells
      her about the city and her family.
    secrets:
    - Dorith does not want the people around them to know Aerith's identity until
      he has spoken with her privately.
    - Aerith has spoken with Dorith and is suspicious of his account.
    - The smaller golem beside Dorith is Aerith's mother, Elorith, transformed and
      controlled.
    possible_approaches:
    - Examine the old drawings and signs that Aerith once lived in the room.
    - Question Dorith about the city, her parents, and the golems.
    - Look for signs that the city is controlled by more than its visible guards.
