  - id: arrive-at-stratos
    name: Arrive at Stratos
    description: 'Aerith is presented to the people of the floating city as the lost
      princess who can help them leave. The explorers aboard The Hive arrive through
      the storm, bringing the separated storylines together.

      '
    description_content: null
    events_content: null
    triggers_content: null
    possible_approaches_content: null
    status: planned
    act: null
    order: 6
    triggers:
    - Aerith reaches the city with Dorith.
    - The explorers survive the storm and reach the floating city.
    events: 'Dorith addresses the crowd and demands that the rebellion surrender.
      The crowd''s response shifts after the golems stand alert. The Hive then appears
      through the storm and crashes into the city, destroying the golems surrounding
      Aerith and pinning Dorith under wreckage.

      '
    secrets:
    - The source draft calls this city Nevarro; the current setting entity is Stratos.
    - Dorith claims that Aerith's father is responsible for trapping the city and
      that the altar can release it.
    possible_approaches:
    - Help Aerith evade the golems and reach the crowd.
    - Try to prevent the ship from crashing into the city.
    - Use the confusion to help Dorith, flee, or make contact with the rebellion.
    leads_to:
