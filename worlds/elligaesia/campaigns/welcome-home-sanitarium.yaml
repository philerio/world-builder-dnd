  - id: doriths-account
    name: Dorith's Account
    description: 'Dorith tells Aerith that her father trapped the city in the sky
      to keep its ancient technology from the outside world. Dorith presents himself
      as the one who wants to share that technology.

      '
    description_content: null
    events_content: null
    triggers_content: null
    possible_approaches_content: null
    status: completed
    act: null
    order: 3
    triggers:
    - Aerith speaks privately with Dorith during the journey or at the city.
    events: 'Dorith describes the city''s ancient technology and the altar that may
      teleport people across distance or time. He says Aerith''s father hid or took
      the key that can control it.

      '
    secrets:
    - Dorith's account is not fully trustworthy; Aerith has already become suspicious
      of him.
    - The original draft calls the destination Nevarro. Current world records identify
      the matching floating city as Stratos; confirm whether Nevarro is an earlier
      name or a separate place.
    - The elves independently learned to activate Stratos's Dwarmar mechanism. Gnomes
      independently use Dwarmar power sources to operate flying ships. These sources
      contain remnants of Bane's power, but neither people knows this.
    possible_approaches:
    - Ask Dorith why the city has no ordinary workers in its halls.
    - Compare his account with the history shown in the old paintings.
    - Keep the key and altar's role secret from the golems and the public.
