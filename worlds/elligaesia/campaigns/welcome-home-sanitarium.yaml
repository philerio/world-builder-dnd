id: welcome-home-sanitarium
name: Welcome Home (Sanitarium)
description: 'An unfinished campaign about two explorers hired by Wicket Warrick to
  investigate a hidden city, while Aerith is drawn into the return of her family''s
  lost city and its mechanized golems.

  '
created: '2026-10-06T18:07:04.230360'
updated: '2026-10-06T18:07:04.230366'
overview: 'A puzzle and exploration campaign with a science-fantasy tone. Two explorers
  meet Wicket Warrick at the docks in Minrath and accept passage aboard his flying
  ship, The Hive. In parallel, Aerith is held in the floating elven city ruled by
  her uncle Dorith. The party''s journeys converge amid a rebellion, a dangerous storm,
  and a series of ancient chambers leading toward the power source of the city''s
  golems.

  '
