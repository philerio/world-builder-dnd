  - id: explore-the-hive
    name: Explore The Hive
    description: 'While The Hive crosses the Shifting Sands, the explorers can learn
      how the ship works and decide whether to investigate its guarded engine room.
      Freya has not yet decided how to spend her time aboard.

      '
    description_content: null
    events_content: null
    triggers_content: null
    possible_approaches_content: null
    status: in_progress
    act: null
    order: 4
    triggers:
    - The explorers accept Wicket's offer and board The Hive.
    events: 'The ship is warm and unusually quiet. Its crew includes bees and orcs
      with name tags; the bees tend the ship and serve mead. The engine room is guarded,
      the captain''s quarters are locked, and the journey will take at least three
      days.

      '
    secrets:
    - The bees do not power the ship; magic does. Wicket lets people believe otherwise.
    - Wicket uses orc souls to help power The Hive's ancient Dwarmar source. Gnomes
      independently learned to use Dwarmar power sources for their flying ships, while
      the elves independently activated Stratos's source. Each contains a remnant
      of Bane's power, but no one aboard knows this.
    - Wicket's arrangement with the queen of the bees involves protecting her lands
      from orc invaders in exchange for the bees' labor; the source notes do not clarify
      the orcs' exact role in that bargain.
    - Wicket becomes angry when an orc drops a traveler's belongings and says the
      orc may be chosen the next day. The orcs appear frightened but quickly resume
      their blank demeanor.
    possible_approaches:
    - Decide what Freya does during the day aboard the ship.
    - Explore the ship's decks, crew quarters, storage area, and mead bar.
    - Try to enter the engine room past its two bee guards.
    - Sneak through the storage room toward the engine room.
    - Ask Wicket about the buzzing, the bees, the orcs, or the ship's power.
    leads_to:
    - cross-the-shifting-sands
