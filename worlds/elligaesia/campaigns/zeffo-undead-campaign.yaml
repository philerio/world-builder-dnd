    order: 11
    triggers:
    - The party follows energy conduits or Edrin's trail to the main chamber.
    - They confront Edrin over the undead experiments.
    - The desperation clock reaches a critical stage or Edrin decides he has no safer
      choice.
    events: 'The Bane stone shines green, with nearby conduits and sockets holding

      rechargeable components.



      Make the source and its machinery visibly distinct: the central stone emits

      the ambient field; conduits draw energy to the golem and smaller stones; a

      cracked Dwarmar control ring around the source was designed to contain and

      regulate it. The broken segment leaves the ambient field exposed, while the

      secondary conduits still draw power.



      Edrin insists the golem might sustain and eventually cure Mira; he wants her

      out of it once it is no longer needed.



      If Edrin is reassured or offered a credible alternative, he may cooperate without

      entering the golem.



      If driven to desperation and the golem remains operable, he enters it and its

      chest stone activates for the first time with a living host.



      At first he seems able to command it. Soon it moves to interpose itself between

      the party and the Bane stone, attacking perceived threats even as he tries to

      stop.



      The party can disable the golem''s power link, restrain or evade it, attempt
      to

      free Edrin, or negotiate if he retains some voice. Disabling the link stops
      the

      golem and further energy draws, but the stone''s ambient influence continues.



      The source can be recontained by restoring the control ring, destroyed, left

      active, or removed in an attempt to secure it elsewhere. Extraction is not

      automatically safe: until the source is contained, it remains active wherever

      it is taken.



      The artifact''s eventual containment, destruction, preservation, or continued

      operation determines the outbreak''s direction and Mira''s prospects.'
    secrets:
    - Edrin knew entering could power the golem only as a hypothesis derived from
      failed undead experiments. He did NOT know he would lose control.
    - Bane's influence drives the host-powered machine to guard the stone, rather
      than indiscriminately attacking everyone who is not aligned with Bane.
    - The golem should use a custom weakened or incomplete encounter appropriate to
      the party's level, not standard iron golem statistics; allow nonlethal disabling
      or escape.
    - Destroying the Bane stone is not automatically a cure for Mira. Continued use
      may keep her alive temporarily but amplifies the outbreak.
    - Keep three outcomes distinct. Cutting the secondary conduits stops the golem
      and further energy draws, but not the stone's natural field. Restoring the original
      control ring contains the intact source and ends its local emissions while containment
      holds. Destroying the source ends future emissions, but a forceful or poorly
      controlled attempt may cause one surge; already-risen undead remain.
    - The source's reawakening overwhelmed and cracked the ancient control ring; Edrin
      did not cause the original damage or the outbreak. His later energy draws can
      create additional pulses while the ring is broken.
    - The control ring is a challenge the party can solve through investigation, Arcana,
      tools, magic, or a plausible combination of actions. Do not make one successful
      roll switch it off; a failed roll should cost time, expose someone to a pulse,
      or damage equipment rather than make containment impossible. Accept an equivalent
      solution if the party proposes a sound way to contain the source; the ring is
      the clearest known method, not the only imaginable one.
    - If the party extracts the stone, treat it as an active source until they devise
      containment. Moving it changes where the danger is centered; it does not neutralize
      the remnant.
    - Destroying the stone ends its local emissions. Whether that also destroys the
      divine remnant, disperses it, or leaves it recoverable is not yet known; do
      not promise a result for Bane's wider plan before that part of the lore is decided.
    - Bane remains a distant threat and the remnant collection mechanism remains undefined.
    - Edrin's private journal is separate from the working notes found earlier. Keep
      it secured with his personal effects until the final chamber is safe; reveal
      or recover it only after this confrontation is resolved.
    possible_approaches:
    - Present a plan to keep Mira stable while suspending Edrin's research.
    - Negotiate with Edrin and examine the stone without activating the golem.
    - Sabotage or disconnect the golem before anyone enters.
    - Use a charged lure stone to distract or redirect undead near the chamber.
    - Fight or evade the golem if it activates.
    - Disable the golem and treatment conduits to stop direct energy draws, knowing
      the source will continue radiating.
    - Restore the Dwarmar control ring to contain the source without destroying it.
    - Destroy the source, prepare for a possible surge, or attempt to remove it for
      containment elsewhere.
    - Retreat to seek help, leaving the consequences to the clocks.
