id: zeffo-undead-campaign
name: Zeffo Undead
description: Rumors have spread of undead appearing in the woods of Zeffo.
tags: []
created: '2026-10-08T23:58:57.776875'
updated: '2026-10-08T23:58:57.776880'
overview: 'The party travels to Zeffo to investigate reports of undead appearing in
  the surrounding woods. What begins as isolated encounters with the restless dead
  develops into a mystery involving disturbed graves, frightened villagers, and strange
  green-glowing eyes.


  Through conversations with Captain Ressa Thorn, the villagers, and Old Bram the
  gravedigger, the party can uncover evidence that the undead are rising without any
  apparent necromancer controlling them. Some appear instinctively drawn toward the
  northern forest.


  Their investigation eventually leads toward forgotten Dwarmar ruins, where an ancient
  artifact is releasing unnatural energy. The party must discover how to stop its
  influence while confronting a local healer whose desperate efforts to save his daughter
  are making the situation worse.'
overarching_plot: 'Following the events of The Unforgiven, Bane''s influence has begun
  spreading across Elligaesia. Although Bane remains imprisoned within a mortal body,
  his awakening has caused ancient Dwarmar artifacts throughout the world to reactivate.
  These artifacts contain remnants of his former divine power.


  One such artifact lies hidden beneath the northern forest near Zeffo. Its reactivation
  has disturbed the boundary between life and death, causing corpses to rise as undead.
  Creatures affected by the artifact display an unnatural green glow, often in their
  eyes. Some of the undead instinctively move toward the artifact, although they are
  not following deliberate orders.


  Edrin Vale, a respected healer in Zeffo, discovered the artifact after it had already
  awakened. Desperate to save his dying daughter, Mira, he began drawing on its power
  to sustain her life. Although Edrin is not responsible for the original outbreak,
  his repeated use of the artifact amplifies its necromantic influence and causes
  more undead to rise.


  Captain Ressa Thorn attempts to protect the settlement and investigate the disturbances,
  unaware of the artifact''s existence. Old Bram, the village gravedigger, notices
  that graves are opening from within and that some undead wander toward the northern
  forest. His discoveries may eventually lead him into danger.


  As the party investigates, two threats develop: the growing undead outbreak and
  Edrin''s increasing desperation. The Rising Dead clock tracks the expansion of the
  artifact''s influence, while Edrin''s Desperation tracks his willingness to take
  greater risks to save Mira.


  The party may eventually discover the forgotten Dwarmar facility and confront Edrin''s
  actions. They must decide how to deal with the artifact and whether Mira can be
  saved without allowing the outbreak to continue. Possible outcomes include containing,
  disabling, destroying, or attempting to preserve the artifact, with consequences
  determined by the party''s choices.


  The artifact''s connection to Bane is part of the larger story of Elligaesia and
  should not be fully revealed during this adventure. Bane seeks to reclaim the remnants
  of his power from multiple Dwarmar artifacts and ultimately open a portal to the
  realm of the gods to take revenge on those who banished him. The exact method and
  number of remnants required remain undefined.'
