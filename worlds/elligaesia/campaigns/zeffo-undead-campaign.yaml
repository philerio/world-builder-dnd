  - encounter: null
    id: zeffo-heart-of-zeffo
    name: The Heart of Zeffo
    description: Deep within the Dwarmar facility, the glowing Bane stone sustains
      the region-wide necromantic influence. A dormant living-host iron golem stands
      nearby with an internal host compartment and chest power stone. Edrin may be
      conducting a desperate treatment experiment when the party reaches him. Negotiation,
      containment, and withdrawal remain possible; if pushed beyond his limits he
      may enter the golem as an untested living host.
    scene_script: []
    description_content:
      nodes:
      - type: text
        text: Deep within the Dwarmar facility, the glowing Bane stone sustains the
          region-wide necromantic influence. A dormant living-host
      - type: entity_link
        text: ' iron golem '
        entity_id: dwarmar-iron-golem-artifact
      - type: text
        text: stands nearby with an internal host compartment and chest power stone.
