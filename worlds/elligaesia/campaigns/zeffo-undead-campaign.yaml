  - encounter: null
    id: zeffo-healers-secret
    name: The Healer's Secret
    description: 'The party uncovers why Edrin keeps returning: he believes a Dwarmar
      iron golem can support Mira''s failing body while the artifact gradually repairs
      her illness, allowing her to leave the machine once cured. His trials on trapped
      undead restore some tissue but neither revive them nor fully power the golem.'
    scene_script: []
    description_content: null
    events_content: null
    triggers_content: null
    possible_approaches_content: null
    status: planned
    act: null
    order: 10
    triggers:
    - The party investigates Edrin's clinic or research notes.
    - They explore the golem workshop and arena.
    - They catch Edrin inspecting or preparing the golem near the artifact.
    events: 'An old golem bears a chest-mounted rechargeable stone and an internal
      occupant compartment. The ancient skeleton Edrin originally discovered inside
      now lies beside the opened harness, moved so he could test undead occupants.


      Edrin''s notes compare several undead subjects and document partial physical
      restoration without true resurrection or golem activation.


      He suspects a living host would complete the process but has never tested it;
      he is not willing to use Mira as an unproven subject.


      Evidence of his fall in the forest, broken leg, and unexpected healing explains
      why he believed the artifact could save her.


      If the party confronts him, Edrin defends his intent to use the golem temporarily
      as life support and asks them not to take away Mira''s last hope.


      If the party met Mira, her expressed hopes and concerns can inform their appeal
      to Edrin; if not, Edrin can describe her condition without the meeting becoming
      mandatory.'
    secrets:
    - Edrin has not successfully operated the golem and does not know a living host
      can lose autonomy.
    - The original skeleton might show that past occupants died inside; it does not
      prove that the device safely cures disease.
    - A living host powers the construct; the strong Bane stone influence can compel
      the host-powered golem to protect the source.
    - Edrin is responsible for dangerous experiments and greater pulses of energy,
      not the initial undead outbreak.
    - Do not decide that the golem either definitely cures Mira or definitely cannot
      help; its medical promise and lasting costs are unresolved until play.
    - The records found here are working notes, not Edrin's private journal. Keep
      the journal secured until the party resolves the final chamber confrontation.
    possible_approaches:
    - Talk to Edrin and offer alternative treatment or containment.
    - Compare the notes with the skeleton and machine.
    - Attempt to disable the harness or stone rather than threatening Edrin.
    - Warn Ressa, return to Mira, or secure the arena first.
    - Threaten or attack Edrin, risking escalation.
    checks:
    - id: zeffo-check-secret-notes
      name: Read Edrin's experiment records
      category: notice
      description: Examine Edrin's lab notes or marked undead specimens.
      roll_type: skill_check
      ability: intelligence
      skill: Investigation
      dc: 12
      success: Identify the sequence of failed undead-host trials and his hypothesis
        that a living host is required.
      failure: See the failures and partial repairs; Edrin can still explain the hypothesis.
    - id: zeffo-check-secret-cause
      name: Assess the golem treatment theory
      category: notice
      description: Compare Edrin's notes with the clinical condition of Mira.
      roll_type: skill_check
      ability: wisdom
      skill: Medicine
      dc: 14
      success: Understand that maintaining bodily function is not proof the underlying
        illness will be cured.
      failure: The long-term outcome remains uncertain, even though the energy does
        repair some tissue.
    - id: zeffo-check-secret-parley
      name: Appeal to Edrin's concern for Mira
      category: notice
      description: Speak with Edrin before threatening the stone or his daughter.
      roll_type: skill_check
