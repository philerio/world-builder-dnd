    triggers:
    - The party hears the cemetery bell ring after dark.
    - Captain Ressa asks the party to investigate disturbed graves.
    - The merchant's testimony leads the party to examine his brother's burial site.
    - Villagers report seeing deceased relatives near the cemetery.
    - The party independently investigates the source of the undead sightings.
    events: 'The party finds several disturbed or empty graves.

      Old Bram, the gravedigger, describes strange noises beneath the cemetery at
      night.

      Bram explains that some of the undead appear to wander toward the northern forest.

      A villager recognizes one of the empty graves as belonging to a recently deceased
      relative.

      The party discovers tracks leading away from the cemetery.

      If the party visits at night, a newly risen undead creature may emerge from
      a grave.

      The undead''s eyes glow faintly green, especially in darkness.'
    secrets:
    - The ancient Dwarmar artifact beneath the northern forest is causing the dead
      to rise.
    - The artifact awakened because of Bane's spreading influence, independently of
      Edrin's actions.
    - The green glow in the undead's eyes indicates the artifact's influence.
    - The undead are not receiving deliberate orders from a necromancer.
    - Some undead instinctively wander toward the northern forest, although not all
      follow a direct route.
    - Old Bram has begun noticing a pattern in the undead's movements.
    - The cemetery does not contain the source of the outbreak.
    - Bram's investigation will eventually lead him toward the forgotten forest ruins.
    - Concentrated energy from the buried Bane stone attracts many undead north, while
      a charged lure stone redirects those reaching the facility into its old testing
      arena.
    possible_approaches:
    - Inspect disturbed graves and examine the surrounding soil.
    - Question Old Bram about recent burials and unusual activity.
    - Review burial records to identify missing bodies.
    - Watch the cemetery overnight to observe the undead.
    - Follow tracks leading away from the cemetery.
    - Attempt to restrain or follow a newly risen undead creature instead of destroying
      it.
    - Use religious or magical knowledge to investigate the undead phenomenon.
    - Report the findings to Captain Ressa.
