        but does not know about the artifact or his experiments.
      belief: She hopes she can recover, but wants to understand the risks and be
        included in decisions about her care.
      shares_if: The party speaks with Mira while she is alert, gives her room to
        answer for herself, and does not make promises about a cure.
      check: null
