  - encounter: null
    id: zeffo-golem-testing-arena
    name: The Golem Testing Arena
    description: 'A towering, open-topped lower testing arena lies below an upper
      observation and loading chamber. The Dwarmar once lowered golems and equipment
      through a large hatch for trials. Edrin has turned the upper loading hatch into
      a resetting drop trap: undead approach a green lure stone, fall into the arena,
      and remain alive below. A separate rear maintenance passage allows Edrin to
      recharge and replace the lure stone without entering the trap.'
    scene_script: []
    description_content: null
    events_content: null
    triggers_content: null
    possible_approaches_content: null
    status: planned
    act: null
    order: 9
    triggers:
    - The party follows corridors or green light to the former testing arena.
    - They hear undead and iron scraping far below the upper level.
    - They follow the rear maintenance route from the workshop.
    events: 'A green stone glows in a high wall socket beyond a broad hatch in the
      upper floor.


      An undead shambles into the upper loading chamber toward the stone; the hatch
      opens underfoot and drops it into the lower arena, then closes.


      From observation walkways, characters can see multiple  undead trapped on the
      arena floor far below, some with partially repaired tissue or medical marks.


      From the rear service passage, a narrow hatch exposes the back of the stone
      socket, enabling a safe swap.


      A secured test cage or hoist provides a dangerous but controlled way to retrieve
      one captive; opening it carelessly could release the undead.


      Damaged construct limbs, heavily reinforced gates, and observation galleries
      reveal the pit''s former purpose.'
    secrets:
    - The arena tested iron golems, not a captive animal; its hatch originally loaded
      golems or experimental apparatus onto the floor below.
    - Undead are drawn to concentrated energy, so the charged lure redirects their
      path from the main source.
    - Edrin has been collecting undead here as test subjects. He has no absolute control
      over their instincts.
    - The lure stone can run down; removing it redirects attention toward the main
      artifact, but does not automatically release those already trapped.
    - The undead in the pit are still active. Do not put the whole crowd into direct
      combat unless characters enter or open the containment route.
    possible_approaches:
    - Observe the hatch in operation from a safe distance.
    - Investigate observation records or damaged golem parts.
    - Reach the stone by the separate maintenance passage.
    - Use a charged stone to redirect undead deliberately.
    - Open the lower arena or test cage, risking escape.
    - Leave the trapped undead contained and continue deeper.
