  world_clocks:
  - id: cc78bb5c-7f31-4731-96d6-20cce75045b8
    name: The Rising Dead
    plot_point_id: null
    description: The already-awake Bane stone radiates necromantic influence through
      the soil and across the forest toward Zeffo. Low-level prolonged exposure raises
      graves in the village; concentration is strongest near the ruins. Fresh surges,
      including those caused by Edrin's treatments or golem experiments, can amplify
      the outbreak. Green-eyed undead may drift toward the main stone or charged lures;
      they are not obeying a necromancer. Advance for meaningful developments and
      elapsed time, not automatically after each encounter.
    current: 1
    maximum: 6
    stages:
    - Undead sightings have become common on the northern roads, and travelers now
      warn one another before crossing the forest.
    - Graves begin opening throughout Zeffo, and recently buried villagers are seen
      wandering at night.
    - Travelers disappear along forest roads, and merchants begin avoiding Zeffo.
    - Undead begin entering the village after dark, forcing residents to barricade
      their homes.
    - A large procession of green-eyed undead gathers and moves toward the ancient
      ruins beneath the forest.
    - The artifact's influence spreads beyond Zeffo, causing the dead to rise in nearby
      settlements.
    completion: The artifact's necromantic influence spreads beyond Zeffo. Graves
      open in surrounding settlements, trade routes become dangerous, and local authorities
      struggle to contain the undead. The outbreak becomes a regional crisis. Even
      if the party later disables the artifact, they must still deal with the undead
      already raised and the consequences of the outbreak.
    status: active
  - id: d7ec951c-400e-420a-9cce-086b7c7c7b77
    name: Edrin's Desperation
    plot_point_id: null
    description: At the campaign's start, Edrin already sustains Mira with charged
      stones, traps undead with the arena lure, and has tested undead subjects in
      the dormant golem. They show partial tissue restoration but do not activate
      it. He suspects a living host might work, has never tested one, and does not
      know the host will lose control. This clock tracks what he does next; it can
      be paused or redirected by credible help.
    current: 0
    maximum: 4
    stages:
    - Mira's condition worsens between treatments, so Edrin draws energy more often.
      A fresh pulse causes a noticeable increase in undead activity near Zeffo.
    - Edrin connects his stronger draws to the pulses but believes he can control
      them. He hides evidence and prepares a more powerful test rather than stopping.
    - An especially powerful undead trial still fails to activate the golem. Edrin
      treats this as confirmation of his living-host theory and prepares the harness
      and a direct transfer, while still hoping the procedure will save Mira.
    - Edrin begins the untested procedure unless the party intervenes. If the golem
      remains operable, he may enter it himself; a high-energy transfer can overload
      the source, but entering the golem alone does not guarantee a surge.
    completion: Edrin attempts his dangerous final procedure unless the party persuades
      him or prevents it. Entering the golem activates it with a living host, then
      the artifact's influence may compel it to defend the Bane stone; this alone
      does not necessarily cause an energy surge. If a high-energy transfer or overloaded
      machinery actually releases an uncontrolled necromantic surge, advance The Rising
      Dead by 2 steps (maximum 6). Mira's survival, Edrin's rescue, and the artifact's
      condition depend on the party's actions.
    status: active
  - id: 788a62b2-a056-460f-8934-66d2792b921b
    name: More Undead Rise
    plot_point_id: b78d97e5-e377-4334-8f6b-a756758bdc58
    description: Optional two-step scene clock for a nighttime cemetery encounter,
      separate from the regional Rising Dead clock. Use it only if other disturbed
      graves are nearby. If the party defeats the first undead quickly or makes a
      loud disturbance, advance once to telegraph another corpse stirring. Advance
      again only if the party stays in the graveyard without quieting, securing, or
      investigating the grave. A quick victory does not automatically cause another
      undead to appear.
    current: 0
    maximum: 2
    stages:
    - Soil shifts and scratching comes from a nearby grave. The party has time to
      react, investigate, or secure it.
    - One additional corpse begins to emerge if the party leaves the grave undisturbed;
      it is a local encounter complication, not a new outbreak wave.
    completion: Resolve at most one additional undead from this clock. If the party
      quiets the area or secures the grave before the clock fills, pause it; this
      scene alone does not advance The Rising Dead.
    status: active
