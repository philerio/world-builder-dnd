  - encounter: null
    id: zeffo-forgotten-facility
    name: The Forgotten Facility
    description: 'Explore a branching Dwarmar underground complex: entry hall, old
      guard rooms, supply closets, barracks, workshop, records archive, service corridors,
      broken equipment, and connecting passages leading toward the testing arena and
      Bane stone. Optional rooms can hold solitary undead, environmental clues, debris,
      resources, or nothing at all.'
    scene_script: []
    description_content: null
    events_content: null
    triggers_content: null
    possible_approaches_content: null
    status: planned
    act: null
    order: 8
    triggers:
    - The party enters through the main Dwarmar entrance.
    - They pursue tracks, energy conduits, or signs of Edrin's passage.
    events: 'MAP CLUE TRAIL (north is the top of the uploaded map)


      1. Entrance and upper corridor: Tool marks, fresh bootprints, and disturbed
      rubble show that a person clears and reuses the old facility. They point inward
      but do not identify Edrin yet.


      2. Northern side rooms and records/workshop spaces: Dwarmar diagrams show an
      iron construct with a chest stone and a body-sized occupant compartment. This
      establishes the golem''s purpose before the party learns Edrin''s plan. Searching
      drawers can also turn up notes about rechargeable stones.


      3. Central conduit junction: Glowing seams and small removable stones feed toward
      the deeper source. A successful examination shows that these stones store charge;
      they are not separate Bane artifacts. The strongest conduit continues toward
      the large southeast chamber.


      4. Large round western chamber: This is the lower golem testing arena, beneath
      an upper loading/observation space. From a safe edge, the party can see the
      reset hatch and undead trapped below. The lure stone draws them away from the
      central source. A rear maintenance branch reaches the back of its socket without
      crossing the drop trap.


      5. Large southeast chamber at the artifact platform: The main Bane stone is
      the source feeding the conduits. The dormant golem and Edrin''s records connect
      the facility, the undead experiments, and Mira''s treatment. Reveal the Bane
      connection only as campaign context permits; the local evidence does not explain
      Bane''s full plan.


      Let the party explore these spaces in a different order. Each clue should still
      be findable from another source or through closer investigation; a failed check
      gives partial information rather than stopping the trail. Keep optional rooms
      empty or lightly populated when the group needs breathing room.'
    secrets:
    - The complex once serviced and tested living-host iron golems. Dwarmar records
      may show body-shaped host cavities and experiments but need not explain Bane.
    - Not every green-glowing component is a separate artifact; smaller stones store
      charge taken from the primary Bane stone.
    - The pit is a lower arena level. Characters cannot walk straight from an upper
      corridor onto its floor.
    possible_approaches:
    - Explore optional rooms in any order.
    - Read old engineering notes or inspect diagrams.
    - Study glowing conduits and sockets.
    - Avoid, trap, or fight scattered undead.
    - Find the service access or continue to the arena.
