    events: 'The party hears a scream from an overturned wagon.

      A zombie attacks the merchant (Venn Calder) trapped beneath the wagon.

      The merchant recognizes the undead as his deceased brother.


      The merchant asks the party to escort him to Zeffo.

      If the party delays, the merchant may be injured or killed.


      If Venn or a party member is injured, villagers may recommend Edrin Vale as
      Zeffo''s healer; this provides an optional introduction to Edrin and Mira.'
    secrets:
    - The corpse rose because of the Dwarmar artifact beneath Zeffo.
    - The artifact awakened due to Bane's growing influence after The Unforgiven.
    - The undead is being drawn toward the northern forest.
    - The merchant knows nothing about the artifact or Bane.
    - The merchant's brother died two years ago and was buried in Zeffo.
    possible_approaches:
    - Attack the undead and protect the merchant.
    - Attempt to rescue the merchant without fighting.
    - Use the wagon or terrain to restrain or distract the undead.
    - Observe the undead before intervening.
    - Flee the encounter.
    - Investigate the corpse after the encounter.
    - Question the merchant about his brother and Zeffo.
