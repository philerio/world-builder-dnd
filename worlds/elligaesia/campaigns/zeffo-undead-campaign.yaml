  - encounter: null
    id: 31e601bf-e0b5-4dfb-8800-6325b337cb5e
    name: Arrival in Zeffo
    description: The party arrives in Zeffo, a settlement bordering the northern forest.
      The residents are increasingly frightened by reports of undead with unnatural
      green-glowing eyes. Captain Ressa Thorn is struggling to maintain order while
      villagers disagree about the cause of the disturbances. The party can speak
      with residents, investigate recent incidents, or offer to help protect the settlement.
    description_content: null
    events_content: null
    triggers_content: null
    possible_approaches_content: null
    status: planned
    act: null
    order: 2
    triggers:
    - The party reaches Zeffo after traveling along the forest road.
    - The party escorts the rescued merchant to the settlement.
    - The party arrives while investigating reports of undead in the region.
    events: 'The party arrives to find villagers preparing to barricade their homes
      before sunset.

      If the merchant survived, he introduces the party to Captain Ressa Thorn.

      Captain Ressa questions the party about their journey and any undead they encountered.

      Villagers share conflicting rumors about the undead sightings.

      A resident reports seeing a deceased relative near the cemetery.

      The village healer, Edrin Vale, is mentioned as someone who has recently performed
      unusual cures.

      A bell rings unexpectedly from the cemetery after dark.'
    secrets:
    - The undead outbreak is caused by an ancient Dwarmar artifact beneath the northern
      forest.
    - The artifact reactivated because of Bane's growing influence following The Unforgiven.
    - The green glow in the undead's eyes is a manifestation of the artifact's power.
    - Edrin has discovered the artifact and is secretly using it to sustain his daughter
      Mira.
    - Edrin did not cause the artifact to awaken, but his experiments are making the
      outbreak worse.
    - Captain Ressa does not know about the artifact or Edrin's involvement.
    - Old Bram, the gravedigger, has noticed that some undead seem to travel toward
      the northern forest.
    possible_approaches:
    - Speak with Captain Ressa and offer assistance.
    - Question villagers about recent undead sightings.
    - Investigate the cemetery or reports of missing bodies.
    - Visit Edrin Vale's clinic to ask about unusual illnesses or injuries.
    - Look for lodging and gather rumors at the local inn.
    - Examine the village's defenses and offer to help prepare for another attack.
    - Ignore the local troubles and pursue another objective.
