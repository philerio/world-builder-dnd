  - encounter: null
    id: 31e601bf-e0b5-4dfb-8800-6325b337cb5e
    name: Arrival in Zeffo
    description: The party arrives in Zeffo, a settlement bordering the northern forest.
      The residents are increasingly frightened by reports of undead with unnatural
      green-glowing eyes. Captain Ressa Thorn is struggling to maintain order while
      villagers disagree about the cause of the disturbances. The party can speak
      with residents, investigate recent incidents, or offer to help protect the settlement.
    scene_script: []
    description_content: null
    events_content:
      nodes:
      - type: text
        text: 'The party arrives to find villagers preparing to barricade their homes
          before sunset.

          If the '
      - type: entity_link
        text: merchant
        entity_id: reference-venn-calder
      - type: text
        text: ' survived, he introduces the party to Captain Ressa Thorn.

          Captain Ressa questions the party about their journey and any undead they
          encountered.

          Villagers share conflicting rumors about the undead sightings.

          A resident reports seeing a deceased relative near the cemetery.

          The village healer, Edrin Vale, is mentioned as someone who has recently
          performed unusual cures.

          A bell rings unexpectedly from the cemetery after dark.


          Ressa may direct injured visitors to Edrin Vale, and townsfolk may mention
          that his daughter Mira has been gravely ill; visiting the clinic is optional,
          but allows the party to meet them both.'
    triggers_content: null
