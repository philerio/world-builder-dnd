    name: The Cemetery Investigation
    description: The party investigates Zeffo's cemetery after reports of disturbed
      graves and sightings of deceased residents. Several graves appear to have opened
      from within, and witnesses describe corpses with faintly glowing green eyes
      wandering toward the northern forest. The investigation offers evidence that
      the undead are rising without a visible necromancer directing them.
    scene_script: []
