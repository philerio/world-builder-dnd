  beats:
  - encounter: null
    id: opening-zeffo-undead-sightings
    name: Zeffo Undead
    description: Rumors have spread of undead appearing in the woods of Zeffo. The
      Council has asked for the help of the adventurers to check it out.
    scene_script:
    - id: 9d077567-dec7-421d-a683-68f35d75721c
      kind: narration
      text: "The Kingdom of Elligaesia is going through a rough time. The various\
        \ nations of the land are experiencing problem after problem. Monsters are\
        \ awakening throughout the land that many thought had gone extinct. \nA mysterious\
        \ island has appeared off the coast of  Teth and Umbara that has sparked tensions\
        \ between the 2 nations. Each wanting to claim it for their own. \nThe ruling\
        \ family of Serenno has been assasinated, and now a civil war is brewing due\
        \ to 2 powerful families wanting to take the throne.\nWith all the political\
        \ turmoil the ruling Council of the kingdom has decided to hire adventures\
        \ to tackle the awakening of monsters throughout the land. \nThey have asked\
        \ adventures to travel to Citadel City in order to get their assignments. "
      speaker: null
    - id: 0e7f2e8f-e3cd-49e2-9893-b092ddc5d62a
      kind: narration
      text: The party answering the call find themselves in the castle of the city.
        They are lead to the great banquet hall where many other adventurers are found.  After
        introductions, the steward to the king will bring the adventurers to the great
        Council chamber
      speaker: null
    - id: 0a731fb0-f8da-4538-bcc3-02e22635a057
      kind: narration
      text: 'The Great Council chamber consists of a large throne with 4 smaller thrones
        on either side. The thrones are in a  curved line with the largest in the
        center. Each throne bares the crest of each ruling family. All but one throne
        is occupied. '
      speaker: null
    - id: 6c5a38d1-83a7-48e3-8c71-a8a9f0f97bbc
      kind: dialogue
      text: "Welcome to the great Council hall. I, as you may know, am your King.\
        \ Krennic first of his name. We welcome you adventurers in our time of need.\
        \ Never before has our kingdom faced this many threats to our daily lives\
        \ as now. You are amongst some of the bravest adventures to be welcomed into\
        \ this hall. Not many have been given such an honor to appear before this\
        \ council. We have a dangerous job for you that we feel only you can accomplish.\
        \ \n(Calls for his squire bring him the task, which is in a scroll)\nWe ask\
        \ you to travel to the town of Zeffo in the North-East region of Nevarro.\
        \ There we ask you to help investigate the stories of undead appearing in\
        \ the area. Not much information has been given to us other than the captain\
        \ of the guard has request help numerous times in the past month. Go now adventurers\
        \ and rid those lands of undead. A great reward will be given if you accomplish\
        \ your task.  "
      speaker: Krennic
