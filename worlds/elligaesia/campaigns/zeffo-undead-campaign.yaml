id: zeffo-undead-campaign
name: Zeffo Undead
description: Rumors have spread of undead appearing in the woods of Zeffo.
tags: []
created: '2026-10-08T23:58:57.776875'
updated: '2026-10-22T00:24:56Z'
overview: 'The party comes to Zeffo after undead sightings multiply along the roads
  and around the cemetery. Green-eyed corpses seem to rise without an obvious necromancer,
  and some wander toward the northern forest. Captain Ressa Thorn seeks help; Old
  Bram''s observations, disturbed graves, and a possible personal meeting with the
  healer Edrin Vale and his ailing daughter Mira offer several independent investigative
  leads.


  Beyond the forest lies a forgotten Dwarmar facility: branching halls, workshops,
  optional rooms, an old golem testing arena turned undead trap, and a powerful green-glowing
  artifact. Exploring the ruins reveals that Edrin''s attempts to keep his dying daughter
  Mira alive have grown into secret experiments with rechargeable stones, undead bodies,
  and an ancient iron golem.


  When the party confronts Edrin, they must decide what to do about the artifact,
  the undead outbreak, and the chance of saving Mira. An iron golem may become a dangerous
  final obstacle if events turn hostile, but it need not be activated at all.'
overarching_plot: 'After The Unforgiven, Bane''s growing influence has awakened ancient
  Dwarmar artifacts holding remnants of his former divine power. Bane remains imprisoned
  in a mortal body; his eventual aim is to recover that power and reach the gods''
  realm. The number of artifacts and how they are combined remain intentionally undefined.


  The Bane stone in a forgotten Dwarmar facility north of Zeffo awakened independently
  of Edrin. It continuously radiates necromantic influence through the surrounding
  land: close to the stone, the energy is concentrated; as far as Zeffo, prolonged
  weaker exposure can raise buried corpses. Its influence spreads unevenly and grows
  over time. The dead sometimes drift toward stronger energy, not because anyone is
  issuing commands. A green glow marks its influence; that glow alone does not mean
  a creature is deliberately serving Bane.


  Searching deep in the northern forest for medicine for his dying daughter Mira,
  healer Edrin Vale encounters undead and flees. The ground collapses beneath him
  into a buried Dwarmar tunnel, breaking his leg. Unable to climb out, he drags himself
  toward green light at the end of the passage and reaches the already-awake Bane
  stone. Its concentrated energy automatically restores his leg as he approaches.
  He later finds an old surface access route and begins returning secretly, convinced
  that the same power might cure Mira.


  The Bane stone contains the only major remnant in this dungeon. Several smaller
  Dwarmar stones are rechargeable components, not additional Bane remnants. Near the
  main artifact, a stone absorbs energy; once removed it slowly runs down. Edrin uses
  one at his clinic to sustain Mira, another as an undead lure, and replacements while
  he cycles stones to recharge. The energy can force damaged or dead tissue to function
  or partially regenerate. A broken leg can appear healed at close range, but suppressing
  symptoms or sustaining organs does not establish a cure for Mira''s illness.


  The deep open pit was a Dwarmar testing arena for iron golems, not a creature pen.
  From an upper observation and loading level, golems and equipment could be lowered
  through a large floor hatch into the lower arena. Edrin repurposed this hatch into
  an automatically resetting drop trap: undead following a charged lure stone enter
  the upper loading chamber and fall through into the arena below. They remain trapped
  there. The lure stone is mounted high in a wall, visible from their entrance, but
  serviced only from behind through a separate maintenance passage reached from the
  safe route toward the artifact. The route does not lead the undead straight to the
  socket. An old secured hoist or cage allows Edrin to retrieve one undead for experiments
  without releasing the others.


  Edrin finds a dormant iron golem beside the main power source. A smaller stone is
  installed in its chest, and skeletal remains lie inside its occupant compartment.
  From this he deduces that the construct was designed to house a body. He removes
  the ancient remains to examine and reuse the compartment, leaving the skeleton nearby
  as evidence. He traps undead in the arena and repeatedly inserts captured specimens
  into the golem using existing restraints and a loading cage. Energy partly restores
  their tissue, but they remain undead and cannot fully activate it. Edrin infers,
  without proof, that a living occupant is required. He hopes the golem could temporarily
  keep Mira alive and, while channeling energy, heal her sufficiently for her to leave
  it. He does not intend to keep her inside permanently and will not risk her before
  testing his theory. He does not know a living host will lose control.


  Captain Ressa Thorn is trying to protect Zeffo and suspects a necromancer, but knows
  nothing of the artifact or Edrin''s involvement. Old Bram finds graves opened from
  within and notices undead moving generally north. His investigations can lead him
  into the forest and danger. Villagers report green-eyed dead and Edrin''s puzzling
  cures, without understanding the common cause.


  The Rising Dead tracks necromantic spread; Edrin''s Desperation tracks worsening
  risks as Mira deteriorates, treatments intensify, and Edrin escalates his golem
  research. Drawing energy from the artifact can send stronger pulses into the surrounding
  area and accelerate reanimation. Clocks follow meaningful time and events, not automatic
  results of every combat. Edrin did not begin the outbreak.


  The party can investigate the town and forest in several orders, explore the facility
  through its main entrance, uncover Edrin''s experiments, and choose whether to bargain
  with him, restrain him, intervene in Mira''s treatment, or disable, contain, preserve,
  or destroy the Bane stone. The golem confrontation is conditional, not inevitable.
  Mira''s survival and Edrin''s fate should respond to their choices; nothing guarantees
  that necromantic tissue repair actually cures her underlying disease.


  Clues in the forest direct the party toward the main facility entrance, preserving
  a playable dungeon crawl. The original collapse where Edrin fell is a dangerous,
  obstructed connection, not the obvious route; a concealed surface service access
  helps explain his visits. Edrin uses a familiar, screened forest route, travels
  cautiously at quiet hours, and can distract lone undead with a charged stone in
  an emergency; the trips are still risky. The facility has branching corridors, dormitories,
  stores, workshops, records rooms, guard posts, and empty chambers to populate with
  optional undead, lore, supplies, or hazards. The testing pit has a genuine lower
  level; it is not a same-level room that tokens can simply walk into. Any player-facing
  battle map should remain unnumbered, with a separate DM room key.


  The golem machinery and green energy echo Dwarmar technology from The Unforgiven.
  The local story should reveal evidence of old Dwarmar experiments without fully
  revealing Bane''s ultimate plan. The precise number of remnants and method of recovering
  them remain undefined.


  A dormant iron golem stands in or near the Bane stone''s chamber. Edrin has tried
  using undead hosts, with partial tissue repair but no successful activation. He
  suspects that an actual living host is required but has not tested it and does not
  know the cost. If cornered or convinced the party will destroy Mira''s only hope,
  he may enter the golem himself both to stop them and to prove his theory. A living
  host activates it, but Bane''s influence progressively overrides the host''s will
  and drives the golem to defend the stone. Edrin did not know this would happen.
  The party may instead negotiate, withdraw, disable machinery, or rescue him; do
  not mandate a boss fight.'
