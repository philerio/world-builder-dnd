  - encounter: null
    id: zeffo-aftermath
    name: What Remains in Zeffo
    description: The party returns to Zeffo after the confrontation and sees how the
      condition of the Bane stone, the remaining undead, and Edrin's fate affect the
      town. This is a short wrap-up scene, not a required new adventure.
    scene_script: []
    description_content: null
    events_content: null
    triggers_content: null
    possible_approaches_content: null
    status: planned
    act: null
    order: 12
    triggers:
    - The party leaves the Dwarmar facility after resolving or postponing the confrontation.
    - Captain Ressa or the villagers learn whether the artifact is contained, destroyed,
      or still active.
    events: 'Return to Zeffo and let the party report what happened to Captain Ressa.
      The town responds to the source''s condition, but the already-risen undead and
      immediate safety needs remain real in every outcome.


      IF THE SOURCE IS CONTAINED: No new reanimations are observed while the containment
      holds. Mira''s charged treatment stone is no longer replenished, but its stored
      power fades over time rather than vanishing at once. That gives the party time
      to plan her care. Existing undead still need to be found, restrained, or laid
      to rest. Ressa organizes patrols and asks the party to help secure the cemetery
      and forest road.


      IF THE SOURCE IS DESTROYED: The stone stops emitting power, but the undead it
      already raised do not vanish. Mira''s charged treatment stone is no longer replenished,
      and its remaining power fades over time. The party and Edrin must arrange care
      without assuming that she is cured or that her outcome is settled immediately.


      IF THE SOURCE IS LEFT ACTIVE OR PRESERVED: The threat remains unresolved. Ressa
      strengthens the watch and asks what the party intends to do next. Advance The
      Rising Dead only when the campaign clock''s stated conditions occur; do not
      make the town fall immediately just because the source remains active.


      IF ONLY THE CONDUITS ARE SEVERED: The golem and treatment apparatus can no longer
      draw power, but the central stone''s ambient field still reaches the region.
      The party has prevented further direct use without resolving the outbreak.


      IF THE SOURCE IS REMOVED WITHOUT CONTAINMENT: Do not treat transport as a solution.
      The source remains active, and the party must find a way to contain it before
      it endangers another place.


      IF THE SOURCE SURGES: Show a specific consequence the party can respond to,
      such as fresh graves opening or a dangerous group of undead approaching the
      road. Apply the clock change from the final chamber and give Ressa time to organize
      a response.


      IF THE JOURNAL IS RECOVERED: Let the party read Edrin''s account of the green
      stone, the undead trials, and his hopes for Mira. The journal gives context
      for his choices, but it does not prove the golem would have cured her or explain
      the stone''s true origin.


      If Edrin survives, he may provide a truthful account and face the town''s response;
      cooperation does not erase the harm from his experiments. If the party met Mira,
      include her in decisions about her care. If they have not met her, this is a
      natural chance to speak with her directly rather than learning her wishes only
      through Edrin.


      Close on the party''s chosen next step: help the survivors, plan Mira''s care,
      report the Dwarmar discovery, leave Zeffo, or continue investigating the larger
      story. Keep the Bane revelation limited to what the party actually learned.'
    secrets:
    - Containing or destroying the source prevents or reduces further emissions; it
      does not undo deaths, cure the risen, or automatically heal Mira.
    - The village may not know the source is connected to Bane unless the party chooses
      to share that information and has evidence.
    - Edrin's accountability and Mira's future are separate questions; neither is
      settled solely by whether he survives.
    possible_approaches:
    - Tell Ressa what happened and help plan patrols or a cemetery cleanup.
    - Check on Mira and ask what kind of help she wants.
    - Decide what to do with Edrin's notes and the surviving Dwarmar components.
    - Help remaining villagers or travelers affected by the undead.
    - Leave Zeffo to pursue another lead.
