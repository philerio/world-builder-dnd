  - encounter: null
    id: c5f4520e-970e-4c0d-a821-3164bf4e5f90
    name: The Healer's Miracles
    description: 'Optional roleplay encounter: the party may meet healer Edrin Vale
      and his ill daughter Mira in Zeffo before ever discovering the ruins. Mira is
      alive because a rechargeable green Dwarmar stone is temporarily sustaining her.
      Edrin hopes an ancient golem could provide temporary life support and gradually
      heal her enough to live outside it; he does not want to imprison her permanently.'
    scene_script: []
    description_content: null
    events_content: null
    triggers_content: null
    possible_approaches_content: null
    status: planned
    act: null
    order: 4
    triggers:
    - Ressa or the rescued merchant recommends Edrin to an injured party member.
    - The party hears rumors of Edrin's unusual cures or of Mira's serious illness.
    - The party offers to help Mira or seeks treatment.
    - Evidence of green energy leads the party to the clinic.
    events: 'When the party visits, Edrin may invite them into the front treatment
      room and, if they are respectful, introduce Mira; if he is away, Mira or a caretaker
      can talk to them and Edrin can be met later.


      Mira is alert at intervals and has her own concerns: she wants to recover and
      worries about how little her father sleeps, but does not know his secret experiments.
      She may describe brief warmth or strength after treatments followed by renewed
      weakness, without explaining the cause.


      Edrin is exhausted, caring, and protective of Mira. He can explain conventional
      medicine but avoids discussing the source of his newest treatments.


      A concealed or guarded apparatus holds a removable stone that intermittently
      glows green during Mira''s treatment.


      Medical journals record an unusually rapid recovery from Edrin''s own broken
      leg, repeated trips into the forest, and trials described in guarded language.


      Mira''s condition improves briefly with treatment, then slips again as the stone''s
      charge fades.


      As trust grows or evidence mounts, the party may learn Edrin thinks the golem
      is a temporary life-support device rather than a permanent prison.'
    secrets:
    - Edrin fell through a collapse into an ancient tunnel while fleeing undead in
      the forest, broke his leg, and was automatically healed near the already-active
      Bane stone.
    - He found another way out and returns to the ruins to recharge several small
      stones, maintain his undead trap, and run golem experiments.
    - 'He has used captive undead as specimens: necromantic energy partly repairs
      tissue but has not restored life or activated the iron golem.'
    - He suspects that a living host may power the golem but has never tested that
      theory. He does not know it can override the host's autonomy.
    - Edrin believes he can sustain Mira inside the golem until she is healthy enough
      to leave. Whether this would truly cure her is unproven.
    - Mira is not aware that Edrin has been capturing undead or considering an ancient
      golem; she can recognize her symptoms and voice her own wishes if the party
      earns her trust.
    - Green necromantic energy sustains tissue and masks symptoms; the Bane stone's
      wider pulses also intensify the outbreak.
    possible_approaches:
    - Meet Edrin and Mira, talk with Mira directly, and ask what she wants rather
      than only listening to her father.
    - Offer Mira mundane care or companionship without promising a miraculous cure.
    - Speak gently to Edrin about Mira and offer help.
    - Observe a treatment or examine his apparatus with permission.
    - Investigate green light, forest excursions, and odd medical records.
    - Confront him with evidence and attempt to negotiate.
    - Leave the clinic and search the forest independently.
