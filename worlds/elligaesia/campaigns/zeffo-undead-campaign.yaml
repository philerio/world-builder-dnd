      roll_type: skill_check
      ability: wisdom
      skill: Insight
      dc: 12
      success: Edrin is hiding dangerous work but is primarily afraid his daughter
        will die.
      failure: He appears defensive and desperate; his motives can still emerge through
        conversation.
    npc_knowledge:
    - id: zeffo-knowledge-edrin-goal
      npc_id: reference-edrin-vale
      information: The stone sustains Mira. Undead golem experiments partially repair
        tissue but have not activated the machine; Edrin suspects a living host might.
      belief: The golem might temporarily sustain Mira and give her time for a real
        treatment, though Edrin hopes it may do more.
      shares_if: Edrin shares fragments of his research only after trust is earned
        or convincing evidence is presented.
      check: null
    - id: zeffo-knowledge-mira-wishes
      npc_id: mira-vale
      information: Treatment brings Mira short periods of warmth and strength, followed
