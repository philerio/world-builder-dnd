  - id: cc78bb5c-7f31-4731-96d6-20cce75045b8
    name: The Rising Dead
    plot_point_id: null
    description: An ancient Dwarmar artifact beneath the forests of Zeffo has awakened
      following the spread of Bane's influence across Elligaesia. Its necromantic
      energy is causing the dead to rise, their eyes glowing an unnatural green. As
      the artifact's influence grows, more undead awaken and begin threatening the
      surrounding settlements. The undead sometimes appear instinctively drawn toward
      the northern forest, where the artifact lies hidden.
    current: 0
    maximum: 6
    stages:
    - Reports of undead sightings become more frequent in the northern forest.
    - Graves begin opening throughout Zeffo, and recently buried villagers are seen
      wandering at night.
    - Travelers disappear along forest roads, and merchants begin avoiding Zeffo.
    - Undead begin entering the village after dark, forcing residents to barricade
      their homes.
    - A large procession of green-eyed undead gathers and moves toward the ancient
      ruins beneath the forest.
    - The artifact's influence spreads beyond Zeffo, causing the dead to rise in nearby
      settlements.
    completion: The artifact's necromantic influence spreads beyond Zeffo. Graves
      open in surrounding settlements, trade routes become dangerous, and local authorities
      struggle to contain the undead. The outbreak becomes a regional crisis. Even
      if the party later disables the artifact, they must still deal with the undead
      already raised and the consequences of the outbreak.
    status: active
  - id: d7ec951c-400e-420a-9cce-086b7c7c7b77
    name: Edrin's Desperation
    plot_point_id: null
    description: Edrin Vale, a respected healer in Zeffo, has discovered an ancient
      Dwarmar artifact and believes its power can save his dying daughter, Mira. Although
      he did not cause the artifact to awaken, his experiments are intensifying its
      necromantic effects. As Mira's condition worsens, Edrin becomes increasingly
      desperate and willing to take dangerous risks.
    current: 0
    maximum: 4
    stages:
    - Edrin secretly begins drawing small amounts of energy from the artifact to sustain
      Mira.
    - Mira's condition worsens, and Edrin increases his use of the artifact, unintentionally
      accelerating the undead outbreak.
    - Edrin realizes his experiments are contributing to the undead activity but refuses
      to stop, fearing Mira will die.
    - Edrin attempts a dangerous ritual to permanently restore Mira's health, risking
      an uncontrolled surge of necromantic energy.
    completion: Edrin performs the ritual, causing the Dwarmar artifact to release
      a powerful surge of necromantic energy. Advance The Rising Dead clock by 2 steps,
      up to its maximum. Mira's fate remains uncertain and depends on the party's
      intervention. Edrin may be injured, corrupted, or forced to confront the consequences
      of his actions.
    status: active
  - id: 788a62b2-a056-460f-8934-66d2792b921b
    name: More Undead Rise
    plot_point_id: b78d97e5-e377-4334-8f6b-a756758bdc58
    description: This occurs if the players defeat the undead in the cemetery too
      quickly
    current: 0
    maximum: 2
    stages:
    - Undead are defeated/or close to death. Party might start hearing movement under
      one of the graves
    - If Undead are defeated, the  Party might start hearing movement under one of
      the graves
    completion: If Undead are still active after round 2, the undead no longer stir
    status: active
