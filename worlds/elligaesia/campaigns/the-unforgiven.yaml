    description: 'Dronath grows stronger as the disappearances continue. Keep paused
      until the DM starts the campaign timeline; advance as nights pass.

      '
    current: 1
    maximum: 3
    stages:
    - 'First night: disappearances continue.'
    - 'Second night: Dronath''s influence spreads to more creatures.'
    - 'Third night: animals attack Reqrun.'
    completion: Animals attack Reqrun under Dronath's influence.
    status: active
  - id: north-road-wards-fail
    name: The Northern Road Wards Fade
    description: 'The adventure draft says two more storms will exhaust the road''s
      protective magic. Advance when a storm occurs after this clue is found.

      '
    current: 0
    maximum: 2
    stages:
    - First additional storm weakens the road's protection.
    - Second additional storm exhausts the wards and frees creatures to roam the road.
    completion: Creatures can roam the northern road freely.
    status: paused
  - id: dronath-three-day-deadline
    name: Dronath's Three-Day Deadline
    description: 'Start this clock only if the party accepts Dronath''s bargain. He
      waits where the river first reaches the lake.

      '
    current: 0
    maximum: 3
    stages:
    - Day 1 after accepting the bargain.
    - Day 2 after accepting the bargain.
    - 'Day 3: Dronath expects the sorcerer to be delivered.'
    completion: Dronath attacks Reqrun if the party fails to meet him.
    status: paused
