id: the-unforgiven
name: The Unforgiven
description: 'The campaign centered on the strange disappearances in Reqrun, the awakening
  of an ancient Aboleth, and the discovery of the sorcerer''s true identity.

  '
created: '2026-10-05T13:48:18.556840'
updated: '2026-10-05T13:48:18.556846'
overview: 'Animals begin disappearing from Reqrun at night, followed by the disappearance
  of the governor''s supposed son. The party investigates the town, follows clues
  toward the northern lake, and becomes entangled in an ancient conflict involving
  an Aboleth and a mysterious sorcerer.

  '
status: completed
locations:
- reqrun
npcs:
- pattrice
- nedda
- frank
- shana - alatar
- dronath
- ann
- fredrick
- orivom
- faela-logleragle
- narle
- bane
player_characters:
- harry
- rowan
- aerith
outcome: 'The party uncovered the truth behind the disappearances and confronted the
  sorcerer and the Aboleth.

  '
consequences: 'Reqrun was liberated from the sorcerer''s influence. The events surrounding
  the Aboleth and the sorcerer''s past revealed deeper forces affecting the world.

  '
story:
  beats:
  - id: meet-the-three-misfits
    name: The Three Misfits Take the Case
    description: The party is approached at a pub south of Reqrun and asked to investigate
      the missing governor's son and the animals that have disappeared at night.
    description_content:
      nodes:
      - type: text
        text: 'The party is approached at a pub south of '
      - type: entity_link
        text: Reqrun
        entity_id: reqrun
      - type: text
        text: ' and asked to investigate the missing governor''s son and the animals
          that have disappeared at night.

          '
    events_content: null
    triggers_content: null
    possible_approaches_content: null
    status: planned
    act: null
    order: 1
    triggers:
    - The party accepts the governor's request for help.
    events: A disheveled messenger brings the case to the party. The town has searched
      for Jackson for several days without success. The governor asks the party to
      meet him at the old capitol building.
    secrets: []
    possible_approaches:
    - Establish how the party knows one another before the case begins.
    - Ask the messenger what the town has already investigated.
    leads_to:
    - arrive-in-reqrun
    locations:
