id: north-elligaesia
name: Northern Elligaesia
description: The northern kingdom of Elligaesia, containing several self-governing nations.
ruler: krennic
capital: scarif-citadel-city
continent: elligaesia
political_level: kingdom
government_type: Ruling council with an elected High Ruler
government_notes: |-
  Northern Elligaesia is governed by a ruling council made up of the political leaders of its nations.

  The national leaders vote to choose the council's High Ruler. A sitting High Ruler can only be replaced when all of the other national leaders agree to replace them.

  The kingdom's current capital is located in the High Ruler's nation. Krennic of Scarif is the current High Ruler, and Citadel City in Scarif is the current capital.
