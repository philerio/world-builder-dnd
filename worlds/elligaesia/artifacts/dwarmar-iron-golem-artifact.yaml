id: dwarmar-iron-golem-artifact
name: Dwarmar Iron Golem
description: 'Ancient Dwarmar technology powered by power sources provided by Bane.
  These Iron Golems require a living host to power them. Once inside the host is no
  longer in control of their own body. The golem takes over, and does the bidding
  of those who control the power source. Iron Golems are powerful constructs. Some
  Dwarmar cities used them for war, while other used them primarily for entertainment. '
