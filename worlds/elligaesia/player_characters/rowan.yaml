id: rowan
name: Rowan
description: >
  A human swordswoman and mercenary driven by the loss of her father
  and her desire for revenge against the Orcs responsible.

details: >
  Rowan was raised in Baldon by her father, a blacksmith who taught
  her how to fight with a sword.

  While exploring one day, Rowan discovered Moose trapped in a cage
  and freed him. Through their connection, Rowan gained the ability
  to communicate with animals.

  While returning from a supply trip, Rowan and her family were
  ambushed by Orcs. Her father was killed by a stab in the back,
  and Rowan killed the remaining Orcs. She swore revenge against
  the Orcs responsible and eventually joined a mercenary group,
  where she met Aerith.

