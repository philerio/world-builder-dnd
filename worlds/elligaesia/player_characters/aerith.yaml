id: aerith
name: Aerith
description: >
  A wood elf mercenary from West Wood who has always suspected that
  she does not truly belong to the family that raised her.

details: >
  Aerith was adopted by the rulers of West Wood and grew up in the
  great elven city. She never felt that she belonged there and has
  only fragmented memories of her early childhood, including bright
  flashes and a faint blue glow.

  Aerith is unusually tall for a wood elf and was naturally gifted
  with a bow from a young age. Her adoptive parents eventually gave
  her a bow bearing ancient lettering, telling her that it belonged
  to her true family.

  After leaving the forest as soon as she was old enough, Aerith
  became a mercenary.
  
  Aerith is technically a High Elf and is connected to the High Elf
  ruling class of Stratos.

  Stratos was believed to have been lost before Aerith's connection
  to the city was revealed.

role: player-character
city: stratos
region: null
kingdom: null

events:
  - stratos-revealed
  - description: >
      Aerith was adopted by the rulers of West Wood.
    campaign: null
    location: null

  - description: >
      Aerith left the forest and became a mercenary.
    campaign: null
    location: null

  - description: >
      Aerith joined the mercenary group that would eventually
      investigate the events in Reqrun.
    campaign: the-unforgiven
    location: reqrun

relationships:
  - character: aerick
    relationship: father
  - character: elorith
    relationship: mother
  - character: dorith
    relationship: maternal uncle
dm_notes: >
  Aerith's mother was transformed into one of the mechanized golems
  controlling Stratos.

  The smaller golem encountered by the party is actually Aerith's
  mother. This truth should remain hidden from the players until the
  appropriate reveal.

  Dorith's control of Stratos and the golems is connected to the
  larger mystery surrounding Aerith's family and the technology
  sustaining the city.