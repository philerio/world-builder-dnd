id: harry
name: Harry
description: >
  A halfling scholar and aspiring fighter whose mysterious ring has
  gradually corrupted him while granting him strange abilities.

details: >
  Harry is a halfling from Haffinton and a scholar of animal studies.
  He discovered a mysterious ring after seeing a flash from the sky.
  Over the years, the ring corrupted him and he became known as the
  "Mad Halfling," although Harry believes that he is completely sane.

  Harry originally wanted to become a fighter and spent time boxing
  in Larton, where he lost repeatedly. He eventually convinced a
  wizard to enchant a pair of gloves for him. The gloves grant him
  great strength but cannot be removed.

  The mysterious ring fits over the gloves. After obtaining both,
  Harry began winning his fights and was eventually recruited by
  the mercenary leader.

