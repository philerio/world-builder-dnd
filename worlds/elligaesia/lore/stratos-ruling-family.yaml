id: stratos-ruling-family
name: Stratos Ruling Family
description: >
  The High Elf family at the center of Stratos's history and its
  connection to Aerith.

details: >
  Aerick and Elorith are the parents of Aerith.

  Elorith is the sister of Dorith, making Dorith Aerith's maternal
  uncle.

  Aerick was responsible for lifting Stratos into the sky using
  ancient Dwarmar technology.

  Dorith currently rules Stratos and controls the city through its
  mechanized golems.

dm_notes: >
  The family relationships are important to the Stratos storyline.
  Elorith's transformation into a mechanized golem and Dorith's
  control of the city directly affect Aerith's personal connection
  to the conflict.

  The full history and motivations of the family should be revealed
  through the campaign.
