common_knowledge: Northern Elligaesia is a kingdom whose nations govern themselves
  while cooperating on shared trade and policy. Its nations include Teth, Umbara,
  Serenno, Scarif, Ryloth, Nevarro, and Mortis. The closure of the southern road has
  created trade pressure as northern nations compensate for goods no longer arriving
  from Batik.
