details: 'The northern kingdom of Elligaesia is divided into 8 nations. Each nation
  is ruled by their own government body. In order to have relations between the different
  nations, they all meet at the capitol of the kingdom, Citadel City, to discuss politics.
  This political body is known as The Council. They all vote to see who is the new
  King whenever a nation''s government body changes. To replace the current king requires
  a majority of votes to replace. The current king is Krennic of Scarif. '
