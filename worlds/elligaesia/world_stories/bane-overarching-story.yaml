id: bane-overarching-story
name: Bane's Influence
description: A setting-wide story about Bane's imprisonment, unleashed influence,
  and pursuit of revenge against the gods.
tags: []
created: '2026-10-05T17:32:46.577274'
updated: '2026-10-05T17:32:46.577279'
overview: 'The events of The Unforgiven unleashed Bane''s influence across Elligaesia,
  even though Bane remains imprisoned within a mortal body. Ancient Dwarmar artifacts
  are activating across the land, and each contains remnants of Bane''s power. Different
  peoples have independently learned to activate and use some of these power sources.
  Bane is working to gather remnants from a certain number of artifacts; once he has
  enough, he can open a portal to the realm of the gods and seek revenge on the gods
  who banished him. The required number and exact collection method have not been
  established.

  '
