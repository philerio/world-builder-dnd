id: scarif-citadel-city
name: Citadel City
description: The capital of Scarif and the current capital of Northern Elligaesia.
kingdom: scarif
details: |-
  Citadel City serves as the capital of Northern Elligaesia while Krennic of Scarif holds the office of High Ruler.

  The kingdom's capital is located in the High Ruler's nation, so its location follows the nation of the current High Ruler.
