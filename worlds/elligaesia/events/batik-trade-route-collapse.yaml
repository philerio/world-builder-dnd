id: batik-trade-route-collapse
name: Collapse of the Batik Trade Route

description: >
  The ancient trade road through Batik has been overtaken by monsters
  after the protective magic surrounding the road began to fail.

type: consequence
status: ongoing

locations:
  - batik

campaigns:
  - the-unforgiven

caused_by:
  - the-unforgiven

true_causes:
  - pattrice

hidden_connections:
  - bane
  - dwarmar
  - bane-overarching-story

world_stories:
  - bane-overarching-story

world_story_threads:
  - world_story_id: bane-overarching-story
    thread_id: influence-unleashed

dm_notes: >
  The protective magic surrounding the road was drained by Pattrice
  during The Unforgiven. He used the stolen magic to power his
  enchantment and sustain himself.

  The collapse of the trade route is one of the larger consequences
  of The Unforgiven and contributes to the political instability
  affecting Elligaesia.

  Bane's influence was unleashed by The Unforgiven and contributed
  to the reactivation of ancient Dwarmar machines and power sources.
  The people affected by the collapse do not know this connection.

consequences:
  - Trade along the southern route has been disrupted.
  - Monsters now threaten travelers using the road.
  - The disruption contributes to growing trade tensions across Elligaesia.

potential_campaign: true
