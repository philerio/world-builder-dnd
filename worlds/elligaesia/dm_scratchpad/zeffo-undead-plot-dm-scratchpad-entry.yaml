content: "Need to figure out the main villian/mob of this story. I'm leaning towards\
  \ vampire, but why now? So with Bane's artifacts being activated, I need to relate\
  \ it to the vampire awakening. Maybe the vampire was trapped in the temple after\
  \ the fall of Bane. Then years later, clerics trapped a vampire inside the temple\
  \ using magic. The artifact can swap magic from it's surroundings, so it could have\
  \ broken the spell on the vampire's tomb. Would this be too difficult for a new\
  \ party? probably for a full on vampire, but what if the vampire is still week,\
  \ and is slowly regaining strength. It could be studying the artifact as well. The\
  \ clerics could have zapped the power from the vampire making him weak. Then when\
  \ he is awakened, he starts to slowly feed. Vampires can take a while to grow power.\
  \ And the longer they are asleep for the weaker they are when they wake up. \n\n\
  Next, what are the signs. How do I get the party to slowly investigate. The undead\
  \ will be coming from the forest. But I need to leave clues on what is causing the\
  \ undead. They may run into it blindly, so I need to give warnings that it is not\
  \ safe to go in unprepared. \n\nNow, how does this affect the overall plot as well?\
  \ Bane is somewhere and he is trying to collect his artifacts. so is he sending\
  \ helpers to different parts of the continent to uncover things? Maybe at least\
  \ with this story they don't run into anything. Or after getting the artifact, they\
  \ run into someone who is very interested in purchasing it. Or even better they\
  \ return with the artifact to the capitol, and someone breaks in and steals it."
