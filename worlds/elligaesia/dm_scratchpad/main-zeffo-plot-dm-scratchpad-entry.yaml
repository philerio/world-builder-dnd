content: "Party arrives in the city of Zeffo. The city appears normal. No sign of\
  \ undead in the city. The city does have an unusual presence of guards along the\
  \ walls. The center of the city has been converted to a place to burn bodies. Need\
  \ to figure out who the ruler of the city is. Governor? Regent? Any way he will\
  \ come out to greet them. Explain the situation. Undead have been appearing for\
  \ the past few months. Originally it was just in numbers of 1 or 2 every few days.\
  \ There didn't really seem to be a pattern to it. Then the numbers started to grow.\
  \ Now the undead come every night in waves of 5-10. They believe the bodies are\
  \ from some of the smaller settlements found in the northern portions of the woods.\
  \ \n\nThey have sent scouting parties into the woods to figure out what is going\
  \ on, but they only return as undead a few nights later. They have asked for clerics\
  \ to come help them, and none of yet to arrive. They are glad the kingdom is finally\
  \ taking this threat seriously by sending actual adventurers here. "
