id: faela-logleragle
name: Faela Logleragle
description: >
  A woman who was placed under the sorcerer's magical influence
  during the events surrounding Reqrun.

details: >
  Faela Logleragle was under the sorcerer's mind control and was
  forced to act against her will. Those subjected to the sorcerer's
  control displayed a faint green glow in their eyes.

  While under the sorcerer's influence, Faela attacked Rowan.
  Rowan killed Faela while defending herself.

