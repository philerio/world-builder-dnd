details: 'Backstory: Tomas has worked grain fields outside Zeffo for most of his adult life. He knows
  the paths through his land by their furrows, drainage, and the marks left by ordinary travelers. He
  is quick to act when he thinks the settlement is in danger, even when he has not yet proved what happened.

  At the table: Tomas is blunt and impatient with speculation. He can describe exactly where the footprints
  crossed his fields, but his conclusion that the dead are gathering for an attack is an anxious interpretation,
  not something the tracks prove.'
motives:
- Protect his fields and the nearby homes from whatever is moving toward the forest.
- Keep frightened neighbors from walking into danger without warning.
goals:
- Preserve the coming harvest and find out whether the tracks return.
- Show the party the crossing point and let them judge the trail for themselves.
fears:
- That the dead will reach the farms before anyone is ready.
- Losing the harvest or being forced to abandon the land he has worked for years.
secrets: []
knowledge:
- Found footprints crossing his fields toward the northern forest.
- Believes the dead are gathering for an attack, but has no proof of their intent.
