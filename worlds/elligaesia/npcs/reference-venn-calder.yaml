details: 'Backstory: Venn built his trade route by being easy to talk to and careful about what a deal
  will cost after the sale. His brother settled in Zeffo and died there two years ago. Venn kept traveling,
  but the burial made the town a personal stop rather than just another market. The recent attack by his
  brother has shaken his confidence in the familiar roads and made him more attentive to what he owes
  the people who trust him.

  At the table: Venn is sociable, quick with fair estimates, and unusually observant about people under
  pressure. He tries to bargain without exploiting anyone and becomes quiet when his brother is mentioned.
  He can give the party a reliable introduction to Captain Ressa once he is safe.

  Separate complication: One crate in his latest shipment is addressed to a town that does not appear
  on any map. Venn sometimes carries letters for clients without reading them; neither fact explains why
  his brother rose.'
motives:
- Make a living through fair trade without placing his crew or customers in needless danger.
- Honor his brother's memory without letting grief make every decision for him.
goals:
- Expand his route without taking on dangerous debt.
fears:
- That another familiar face will return as one of the dead.
- Taking on debts or promises he cannot keep when business turns bad.
secrets:
- He sometimes carries letters for clients without reading them.
knowledge:
