id: bane
name: Bane
description: >
  An ancient god who interfered with mortals and was punished by the
  other gods. Rather than destroy him, the gods imprisoned Bane within
  the body of a mortal sorcerer, stripping away much of his memory.
role: God
details: >
  Bane's influence continues to affect the world long after his
  banishment. His influence was unleashed across Elligaesia after
  The Unforgiven. Ancient Dwarmar artifacts contain remnants of his
  power, and Bane is working to gather enough remnants to open a portal
  to the realm of the gods and take revenge on those who banished him.
  The required number of artifacts is not yet established.
motives:
  - Take revenge on the gods who banished him.
goals:
  - Gather remnants of his power from a certain number of ancient Dwarmar artifacts.
  - Open a portal to the realm of the gods once he has gathered enough power.
fears: []
secrets:
  - The people of Elligaesia do not know that Bane's influence is behind the recent crises or the activation of Dwarmar artifacts.
knowledge:
  - Every ancient Dwarmar artifact contains remnants of Bane's power.
