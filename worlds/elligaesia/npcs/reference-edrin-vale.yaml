job: Healer
race: Elf
alignment: Lawful Neutral
role: Village healer and father
city: zeffo-city
region: null
kingdom: umbara
tags:
- Zeffo
- Campaign NPC
motives:
- Ease Mira's suffering and give her a chance to recover.
- Keep the people of Zeffo safe, even as his own secrecy puts them at risk.
goals:
- Save his daughter Mira.
- Find a way to keep her stable that does not depend on increasingly dangerous experiments.
fears:
- That Mira will die if he stops the treatment before finding another option.
- That he has made the undead danger worse and will lose the trust of the town he serves.
secrets:
- He found an already-active Dwarmar artifact after falling into a buried tunnel in the northern forest; its energy restored his broken leg.
- He uses rechargeable stones from the facility to sustain Mira and has tested the energy on captured undead.
- He suspects a living occupant may activate the ancient iron golem, but has never tested the theory and does not know the risk to the occupant.
knowledge:
- The Dwarmar artifact was active before he reached it; he did not cause the initial outbreak.
- Smaller stones can absorb energy near the artifact and slowly lose their charge after being removed.
- The energy can briefly sustain tissue and restore some damage, but his observations do not prove that Mira's underlying illness can be cured.
- Undead specimens showed partial tissue repair but did not activate the golem.
events:
- description: Fell through a collapsed tunnel while fleeing undead, broke his leg, and reached an already-active artifact that restored it.
