id: reference-edrin-vale
name: Edrin Vale
description: Zeffo's respected healer, whose effort to keep his daughter alive has led him into dangerous Dwarmar experiments.
details: >-
  Backstory: Edrin built his life around practical medicine and patient privacy. He
  is known for treating injuries from the road and helping villagers even when they
  cannot pay. Before Mira became gravely ill, he was careful about the limits of what
  medicine could promise. Her worsening condition has worn down those boundaries:
  he now treats every brief improvement as a reason to keep searching for more.

  At the table: Edrin is genuinely helpful at first. He treats injured villagers,
  offers the party medical assistance, and may help Captain Ressa care for people
  hurt in attacks. He is tired but organized, and tends to answer medical questions
  precisely while redirecting questions about his newest treatments.

  Signs of strain: He becomes uncomfortable when asked where he obtains certain
  treatments; he is exhausted from traveling into the forest at night; he refuses
  to let strangers examine Mira without her consent; and he reacts with unusual
  concern when the party mentions the northern ruins. These signs point to a fearful
  father protecting a secret, not someone who began the outbreak or set out to harm
  Zeffo.

  His central conflict is that the same power giving Mira temporary relief is
  worsening the danger around Zeffo. Edrin can accept help if the party gives him a
  credible way to protect Mira while suspending the experiments. If he believes they
  will take away her only chance, he may become defensive or attempt the untested
  golem plan. He does not know that a living host would lose control.
