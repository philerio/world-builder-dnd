  campaign: zeffo-undead-campaign
  location: zeffo-city
relationships:
- character: mira-vale
  relationship: father
  notes: He loves her deeply, but his fear for her can lead him to withhold information and make decisions for her.
- character: captain-ressa-thorn
  relationship: trusted town healer
  notes: Ressa sends injured residents to Edrin and trusts his medical judgment; she does not know about his artifact or experiments.
- character: old-bram-npc
  relationship: fellow Zeffo resident
  notes: Edrin has treated Bram and knows his cemetery observations, but does not know the artifact is drawing the dead north.
