details: >-
  Backstory: Ressa grew up in Zeffo and joined the watch as a young adult. After years
  of ordinary patrols and road duty, she was promoted to captain when the previous
  captain stepped down. She earned the post by being dependable rather than dramatic:
  she knows the lanes, the shift routines, and which residents will need help before
  they ask for it.

  At the table: Ressa asks direct questions and turns answers into practical plans.
  She is not cold, but she is careful with promises she cannot guarantee. The outbreak
  has stretched the watch thin; she quietly counts patrols, moves guards toward the
  northern approach, and tries to keep residents from panicking. If the party helps,
  she treats them as allies and shares what she can verify. She suspects a necromancer
  may be involved but has no evidence and knows nothing about the artifact or Edrin's
  role.

  Ressa's burden is not that she lacks courage; it is that every guard sent to one
  place leaves another street less protected. She respects people who bring useful
  observations and dislikes anyone who treats frightened residents as foolish.
motives:
- Protect Zeffo's residents and keep the watch functioning without spreading panic.
- Find a cause she can act on instead of chasing rumors.
goals:
- Coordinate safe patrols, barricades, and a response to the missing residents.
- Learn whether the undead are being directed by someone or moving on their own.
fears:
- That the watch will be unable to respond when two places need help at once.
- That one of her decisions will leave a resident or guard exposed.
secrets:
- She has fewer guards available than she admits publicly and is holding back that detail to prevent panic.
knowledge:
- Reports describe green-eyed undead near the cemetery, forest road, and northern approach.
- She suspects a necromancer but has no proof of one and does not know the artifact or Edrin's involvement.
- Old Bram has reported opened graves and northbound movement; she is worried he will investigate alone.
