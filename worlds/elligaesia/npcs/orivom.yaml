id: orivom
name: Orivom
description: >
  A friendly dwarf farmer in Reqrun who loves fishing, good company,
  and cooking.

details: >
  Orivom is a friendly dwarf farmer who lives on the south side of
  Reqrun near the river. He enjoys fishing and spending time with
  other people, and is known as a great cook.

  Orivom is somewhat superstitious and is knowledgeable about the
  dangers surrounding the area. He warns travelers about the
  mountain lake north of Reqrun.

  Orivom has helped defend the town from Orcs in the past.

  During the disappearances, four of Orivom's prize goats went
  missing.

role: farmer
city: reqrun
region: null
kingdom: null

events:
  - description: >
      Four of Orivom's prize goats went missing during the events
