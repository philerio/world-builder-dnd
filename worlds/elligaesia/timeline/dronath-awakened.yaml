dm_notes: 'Dronath was trapped beneath Reqrun for approximately 1000 years. Construction
  and explosions associated with the new capitol disturb his prison and allow him
  to become active again.

  Dronath discovers that the sorcerer responsible for his imprisonment is still alive
  and living in Reqrun.

  Dronath does not initially seek to destroy the town. His primary goals are to regain
  his strength and find the sorcerer.'
