dm_notes: 'The disappearances are caused by Dronath, the Aboleth beneath Reqrun. His
  minions harvest livestock so that he can feed and regain his strength after being
  trapped for centuries.

  The disappearances are the initial mystery that draws the Misfits into the events
  of The Unforgiven.'
